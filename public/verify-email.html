<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Email — CoachPro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #fff;
      max-width: 420px;
      width: 100%;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      text-align: center;
    }
    .logo {
      color: #0a2f60;
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 8px;
    }
    h1 {
      color: #111827;
      font-size: 22px;
      margin: 0 0 8px;
    }
    p {
      color: #4b5563;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    form { display: flex; flex-direction: column; gap: 16px; }
    label {
      text-align: left;
      color: #374151;
      font-size: 13px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #0a2f60; }
    button {
      background: #0a2f60;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0b356b; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .message.success { background: #dcfce7; color: #166534; display: block; }
    .message.error { background: #fee2e2; color: #991b1b; display: block; }
    .code-display {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #0a2f60;
      margin: 16px 0;
    }
    .resend {
      margin-top: 16px;
      font-size: 13px;
      color: #6b7280;
    }
    .resend a {
      color: #0a2f60;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo" id="appName">CoachPro</div>
    <h1>Verify Your Email</h1>
    <p>Enter the 6-digit verification code we sent to your inbox to activate your account.</p>

    <form id="verifyForm">
      <div>
        <label for="coach_id">Coach ID</label>
        <input type="text" id="coach_id" name="coach_id" placeholder="Paste your coach ID" required>
      </div>
      <div>
        <label for="code">Verification Code</label>
        <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
      </div>
      <button type="submit" id="submitBtn">Verify Email</button>
    </form>

    <div id="message" class="message"></div>

    <div class="resend">
      Didn't receive the code? <a href="#" id="resendLink">Resend code</a>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin.replace(/:\d+$/, '') + ':8000';
    const appName = document.getElementById('appName');
    if (new URLSearchParams(window.location.search).get('app')) {
      appName.textContent = new URLSearchParams(window.location.search).get('app');
    }

    // Pre-fill coach_id from URL if present
    const params = new URLSearchParams(window.location.search);
    if (params.get('coach_id')) {
      document.getElementById('coach_id').value = params.get('coach_id');
      document.getElementById('code').focus();
    }
    if (params.get('code')) {
      document.getElementById('code').value = params.get('code');
    }

    const form = document.getElementById('verifyForm');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    function showMessage(text, isError = false) {
      messageEl.textContent = text;
      messageEl.className = 'message ' + (isError ? 'error' : 'success');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.className = 'message';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';

      const coach_id = document.getElementById('coach_id').value.trim();
      const code = document.getElementById('code').value.trim();

      try {
        const response = await fetch(`${API_URL}/v1/auth/verify-email`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ coach_id, code }),
        });

        const data = await response.json().catch(() => ({}));

        if (response.ok) {
          const payload = data.data ?? data;
          showMessage('Email verified successfully! You can now complete your subscription setup.');
          if (payload.setup_token) {
            const coachIdField = document.getElementById('coach_id').value.trim();
            setTimeout(() => {
              window.location.href = `/subscription/select-plan?setup_token=${encodeURIComponent(payload.setup_token)}&coach_id=${encodeURIComponent(coachIdField)}`;
            }, 2000);
          } else if (payload.access_token) {
            setTimeout(() => {
              window.location.href = payload.redirect || '/dashboard';
            }, 2000);
          }
        } else {
          showMessage(data.message || 'Verification failed. Please check your code and try again.', true);
        }
      } catch (err) {
        showMessage('Network error. Please make sure the backend server is running.', true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Verify Email';
      }
    });

    document.getElementById('resendLink').addEventListener('click', async (e) => {
      e.preventDefault();
      const coach_id = document.getElementById('coach_id').value.trim();
      if (!coach_id) {
        showMessage('Please enter your Coach ID first.', true);
        return;
      }

      try {
        const response = await fetch(`${API_URL}/v1/auth/resend-verification`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ coach_id }),
        });
        const data = await response.json().catch(() => ({}));
        showMessage(response.ok ? 'A new verification code has been sent.' : (data.message || 'Could not resend code.'), !response.ok);
      } catch (err) {
        showMessage('Network error. Please make sure the backend server is running.', true);
      }
    });
  </script>
</body>
</html>
