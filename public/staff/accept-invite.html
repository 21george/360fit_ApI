<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accept Your Invite — CoachPro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #fff;
      max-width: 420px;
      width: 100%;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      text-align: center;
    }
    .logo { color: #0a2f60; font-size: 24px; font-weight: 700; margin: 0 0 8px; }
    h1 { color: #111827; font-size: 22px; margin: 0 0 8px; }
    p { color: #4b5563; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e5e7eb;
      border-top-color: #0a2f60;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .message { margin-top: 20px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
    .message.error { background: #fee2e2; color: #991b1b; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">CoachPro</div>
    <h1>Accept Your Invite</h1>
    <p>Redirecting you to the account setup page...</p>
    <div class="spinner"></div>
    <div id="message" class="message"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      document.querySelector('.spinner').style.display = 'none';
      const msg = document.getElementById('message');
      msg.textContent = 'Invalid or missing invite token. Please check your invite link.';
      msg.className = 'message error';
    } else {
      // Redirect to the frontend accept-invite page so the proper auth flow runs.
      const frontendUrl = params.get('redirect_url')
        || (window.location.origin.replace(/:\d+$/, '') + ':3000');
      window.location.href = `${frontendUrl}/staff/accept-invite?token=${encodeURIComponent(token)}`;
    }
  </script>
</body>
</html>
